name: Hyundai News Bot

on:
  schedule:
    # 한국 시간 기준: 오전 6시, 7시, 오후 2시, 5시, 7시 실행
    # (UTC 기준: 21, 22, 05, 08, 10시)
    - cron: '0 21,22,5,8,10 * * *'
  # 수동 실행 버튼 활성화
  workflow_dispatch: 

jobs:
  run_bot:
    runs-on: ubuntu-latest
    
    steps:
      # 최신 환경 지원 버전 사용
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run news bot
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
