name: Hyundai News Bot

on:
  schedule:
    # 한국 시간 기준: 오전 6시, 7시, 오후 5시, 7시 자동 실행
    - cron: '0 21,22,8,10 * * *'
  # 이 설정이 있어야 오른쪽 상단에 [Run workflow] 버튼이 나타납니다.
  workflow_dispatch: 

jobs:
  run_bot:
    runs-on: ubuntu-latest
    
    # Node.js 20 경고를 제거하고 Node.js 24 환경을 강제로 사용합니다.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run news bot
        env:
          # 깃허브 Settings > Secrets 에 저장한 이름과 똑같아야 합니다.
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
