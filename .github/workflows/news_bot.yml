name: Hyundai News Bot

on:
  schedule:
    # 한국 시간(KST): 오전 6시, 7시, 오후 5시, 7시
    - cron: '0 21,22,8,10 * * *'
  workflow_dispatch: 

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v3에서 v4로 업그레이드!

      - name: Set up Python
        uses: actions/setup-python@v5 # v4에서 v5로 업그레이드!
        with:
          python-version: '3.11' # 파이썬도 최신 버전으로!

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run news bot
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
