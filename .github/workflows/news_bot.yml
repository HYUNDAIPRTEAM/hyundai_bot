name: Hyundai News Bot

on:
  schedule:
    # 한국 시간(KST): 오전 6시, 7시, 오후 5시, 7시 (UTC 기준 +9시간 차이 적용)
    - cron: '0 21,22,8,10 * * *'
  workflow_dispatch: # 언제든 수동으로 실행하고 싶을 때 사용하는 버튼을 만듭니다.

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests feedparser # 구글 뉴스를 위해 feedparser를 추가했습니다!

      - name: Run news bot
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
